coverage:
  precision: 2
  round: down
  range: "70..100"

parsers:
  gcov:
    branch_detection:
      conditional: yes
      loop: yes
      method: no
      macro: no

comment:
  layout: "reach,diff,flags,tree"
  behavior: default
  require_changes: false
  require_base: false
  require_head: true
  deletions_only: false

ignore:
  - "node_modules"
  - "dist"
  - "build"
  - ".venv"
  - "venv"

flags:
  frontend:
    paths:
      - "components/"
      - "services/"
      - "index.tsx"
    carryforward: true
  backend:
    paths:
      - "backend/"
    carryforward: true
  circuits:
    paths:
      - "circuits/"
    carryforward: true
  kernel:
    paths:
      - "kernel/"
    carryforward: true
