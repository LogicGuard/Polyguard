name: Python CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.11]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; else pip install flask; fi
      - name: Lint (ruff)
        run: |
          python -m pip install ruff
          ruff check . || true
      - name: Run tests
        run: |
          python -m pip install pytest pytest-cov
          if [ -d backend/tests ]; then pytest backend/tests -v --cov=backend --cov-report=xml --tb=short || true; else pytest backend --tb=short || true; fi
      - name: Upload coverage to codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false

