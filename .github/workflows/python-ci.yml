name: Python CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.11]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if (Test-Path backend\requirements.txt) { pip install -r backend\requirements.txt } else { pip install -r requirements.txt } 
      - name: Lint (ruff)
        run: |
          python -m pip install ruff
          ruff check . || true
      - name: Run tests
        run: |
          if (Test-Path backend\) { cd backend }
          pytest -q || true
      - name: Upload coverage to codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
