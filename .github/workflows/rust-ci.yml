name: Rust CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  rust-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@v1
      - name: Find and run cargo test for all Cargo.toml
        run: |
          set -e
          for f in $(git ls-files "**/Cargo.toml"); do
            d=$(dirname "$f")
            echo "Running cargo test in $d"
            (cd "$d" && cargo test)
          done
