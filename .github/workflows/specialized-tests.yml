name: Specialized Tests Runner

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run-specialized-tests:
    name: Run specialized test suites and generate result file
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install system deps (best-effort)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y solc clang build-essential pkg-config libssl-dev llvm lld npm jq || true

      - name: Make runner script executable
        run: |
          chmod +x ./scripts/run_specialized_tests.sh

      - name: Run specialized test runner
        run: |
          ./scripts/run_specialized_tests.sh

      - name: Upload results artifact
        uses: actions/upload-artifact@v4
        with:
          name: specialized-test-results
          path: SPECIALIZED_TEST_RESULTS.md

      - name: Show short preview
        run: |
          echo "--- HEAD of results ---"
          head -n 80 SPECIALIZED_TEST_RESULTS.md || true
