name: Specialized Tests Runner

on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 2 * * *' # nightly at 02:00 UTC

permissions:
  contents: write
  issues: write

jobs:
  run-specialized-tests:
    name: Run specialized test suites and generate result file
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Pull security CI image from GHCR
        run: |
          set -e
          echo "Attempting to pull CI image from GHCR"
          docker pull ghcr.io/${{ github.repository_owner }}/polyguard/security-ci:latest || true

      - name: Run specialized test runner inside CI image (GHCR)
        run: |
          if docker image inspect ghcr.io/${{ github.repository_owner }}/polyguard/security-ci:latest > /dev/null 2>&1; then
            echo "Running inside GHCR image"
            docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace ghcr.io/${{ github.repository_owner }}/polyguard/security-ci:latest /bin/bash -c "chmod +x ./scripts/run_specialized_tests.sh && ./scripts/run_specialized_tests.sh"
          else
            echo "GHCR image not available, building locally as fallback"
            docker build -f .github/ci/security-ci.Dockerfile -t polyguard/security-ci:latest .
            docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace polyguard/security-ci:latest /bin/bash -c "chmod +x ./scripts/run_specialized_tests.sh && ./scripts/run_specialized_tests.sh"
          fi

      - name: Make runner script executable
        run: |
          chmod +x ./scripts/run_specialized_tests.sh

      - name: Upload results artifact
        uses: actions/upload-artifact@v4
        with:
          name: specialized-test-results
          path: SPECIALIZED_TEST_RESULTS.md

      - name: Show short preview
        run: |
          echo "--- HEAD of results ---"
          head -n 80 SPECIALIZED_TEST_RESULTS.md || true

      - name: Upload results artifact
        uses: actions/upload-artifact@v4
        with:
          name: specialized-test-results
          path: |
            SPECIALIZED_TEST_RESULTS.md
            SPECIALIZED_TEST_RESULTS.json

      - name: Create GitHub issue on critical findings
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const path = 'SPECIALIZED_TEST_RESULTS.json';
            if (!fs.existsSync(path)) {
              core.info('No JSON results found, skipping issue creation');
            } else {
              const data = JSON.parse(fs.readFileSync(path, 'utf8'));
              if (data.critical_findings) {
                const title = `CI Alert: Specialized tests found CRITICAL findings (${new Date().toISOString()})`;
                const body = `Automated specialized tests detected critical findings.\n\nSummary:\n\n\`
${JSON.stringify(data, null, 2)}\n\
\nPlease review SPECIALIZED_TEST_RESULTS.md artifact for full logs.`;
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title,
                  body,
                });
              } else {
                core.info('No critical findings detected')
              }
            }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
