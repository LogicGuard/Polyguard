name: Publish Security CI Image

on:
  push:
    branches: [ main, logicguard-literate-telegram ]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR with GHCR_TOKEN (preferred)
        if: ${{ secrets.GHCR_TOKEN != '' }}
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Login to GHCR with GITHUB_TOKEN (fallback)
        if: ${{ secrets.GHCR_TOKEN == '' }}
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push security CI image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: .github/ci/security-ci.Dockerfile
          push: true
          tags: ghcr.io/${{ toLower(github.repository_owner) }}/polyguard/security-ci:latest,ghcr.io/${{ toLower(github.repository_owner) }}/polyguard/security-ci:${{ github.sha }}
          platforms: linux/amd64,linux/arm64
